<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Oil Change System</title>

<style>
body {font-family:sans-serif;background:#0f172a;color:#e2e8f0;margin:0;}
.container{max-width:900px;margin:auto;padding:20px;}
.card{background:#1e293b;padding:20px;margin-top:15px;border-radius:12px;}
input,select{padding:10px;margin:5px;border-radius:8px;border:none;background:#334155;color:white;}
button{padding:10px 15px;background:#38bdf8;border:none;border-radius:6px;cursor:pointer;}
table{width:100%;margin-top:15px;border-collapse:collapse;}
td,th{padding:10px;text-align:center;border-bottom:1px solid #334155;}
th{color:#38bdf8;}
.btn-del{background:red;color:white;}
</style>
</head>

<body>
<div class="container">

<h2>🛢️ ระบบบันทึกถ่ายน้ำมันเครื่อง</h2>
<button onclick="location.href='index.html'">⛽ กลับหน้า Fuel</button>
<div class="card">
<select id="car"></select>
<input id="model" placeholder="รุ่นรถ">
<input id="liter" type="number" placeholder="กี่ลิตร">
<input id="oilName" placeholder="ชื่อน้ำมันเครื่อง">
<input id="km" type="number" placeholder="กี่กิโลก่อนเปลี่ยน">
<input type="date" id="date">
<button onclick="add()">💾 บันทึก</button>
</div>

<div class="card">
<table>
<thead>
<tr>
<th>วันที่</th>
<th>รถ</th>
<th>รุ่น</th>
<th>ลิตร</th>
<th>น้ำมันเครื่อง</th>
<th>กม.</th>
<th>ลบ</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>
</div>

</div>

<script>
let oilDB = JSON.parse(localStorage.getItem("oilDB")) || {};
let cars = JSON.parse(localStorage.getItem("cars")) || {};

function init(){
    date.valueAsDate = new Date();

    // โหลดรถจากระบบเดิม
    Object.keys(cars).forEach(c=>{
        car.add(new Option(c,c));
        if(!oilDB[c]) oilDB[c]=[];
    });

    render();
}

function save(){
    localStorage.setItem("oilDB", JSON.stringify(oilDB));
}

function add(){
    let c = car.value;
    if(!c) return alert("เลือกก่อน");

    let obj = {
        date: date.value,
        model: model.value,
        liter: liter.value,
        oil: oilName.value,
        km: km.value
    };

    oilDB[c].push(obj);
    save();
    render();

    model.value="";
    liter.value="";
    oilName.value="";
    km.value="";
}

function del(i){
    let c = car.value;
    oilDB[c].splice(i,1);
    save();
    render();
}

function render(){
    let c = car.value;
    let data = oilDB[c] || [];

    table.innerHTML="";

    data.forEach((d,i)=>{
        table.innerHTML += `
        <tr>
        <td>${d.date}</td>
        <td>${c}</td>
        <td>${d.model}</td>
        <td>${d.liter}</td>
        <td>${d.oil}</td>
        <td>${d.km}</td>
        <td><button class="btn-del" onclick="del(${i})">ลบ</button></td>
        </tr>`;
    });
}

car.onchange = render;

init();
</script>

</body>
</html>
